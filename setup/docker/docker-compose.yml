# VirtualPyTest — complete stack on one machine.
#
#   ./launch.sh                      (recommended: creates .env with secrets, picks the
#                                     platform override, brings everything up)
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d --build
#
# Services: Supabase (db / auth / rest / meta / studio / gateway — see supabase/),
# db-init (applies setup/db/schema once), redis, minio (+ bucket init),
# backend_server, backend_host, frontend, grafana.
#
# Everything the browser must reach is published on ${PUBLIC_HOST} (set in .env):
#   frontend 5073 · server API 5109 · host API 6109 · noVNC 6080 · Grafana 3000
#   Supabase API + Studio 54321 · Postgres 54322 · MinIO 9000 (console 9001)
# Config reference: docs/get-started/configuration.md
#
# Every VirtualPyTest service carries both `image:` and `build:`. With the default
# VPT_IMAGE_TAG=local they are built from this checkout; set VPT_IMAGE_TAG to a release
# tag in .env and launch.sh pulls them from GHCR instead, so nothing compiles on the
# machine. The frontend is publishable because it no longer bakes VITE_* in: its
# entrypoint writes dist/config.js from the environment above on every start.

name: virtualpytest

include:
  # No env_file here on purpose (BUG-0163). It used to say `setup/docker/.env`, which
  # different Compose versions resolve differently — some relative to CWD (where it's
  # correct), some relative to this file's own directory setup/docker/ (where it doubles to
  # setup/docker/setup/docker/.env and fails) — so no single string satisfied both the
  # self-hosted CI runners and the GitHub-hosted ones at once. Dropping the line entirely
  # sidesteps the ambiguity: the top-level project's own .env (loaded via the ordinary
  # CWD-relative `--env-file`/COMPOSE_ENV_FILE path, which every Compose version agrees on)
  # already supplies these same vars to the included file in the same substitution pass —
  # confirmed byte-identical `docker compose config` output with and without this line.
  - path: supabase/docker-compose.yml

services:

  # Applies setup/db/schema/*.sql once (skips when the schema is already there) and
  # creates the read-only role Grafana uses. Exits 0 when done; the app waits for it.
  db-init:
    container_name: vpt-db-init
    image: postgres:17.6
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ../db:/setup-db:ro
      - ./scripts/db_init.sh:/db_init.sh:ro
    entrypoint: ["/bin/bash", "/db_init.sh"]

  redis:
    container_name: vpt-redis
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  minio:
    container_name: vpt-minio
    build:
      context: ../..
      dockerfile: setup/docker/images/minio/Dockerfile
    image: ${VPT_REGISTRY:-ghcr.io/angelstreetcorp}/minio:${VPT_IMAGE_TAG:-local}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket and makes it world-readable (public-URL mode, like the VM install).
  minio-init:
    container_name: vpt-minio-init
    build:
      context: ../..
      dockerfile: setup/docker/images/minio-mc/Dockerfile
    image: ${VPT_REGISTRY:-ghcr.io/angelstreetcorp}/minio-mc:${VPT_IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-virtualpytest}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\" &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        mc anonymous set download local/$$MINIO_BUCKET &&
        echo 'bucket ready'
      "

  backend_server:
    container_name: vpt-server
    build:
      context: ../..
      dockerfile: backend_server/Dockerfile
    image: ${VPT_REGISTRY:-ghcr.io/angelstreetcorp}/virtualpytest-server:${VPT_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_NAME: ${SERVER_NAME:-vpt-docker}
      SERVER_URL: http://${PUBLIC_HOST:-localhost}:5109
      SERVER_PORT: "5109"
      # Supabase over the docker network; the keys come from .env (single source)
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      GRAFANA_URL: http://grafana:3000
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-virtualpytest}
    ports:
      - "5109:5109"
    depends_on:
      db-init:
        condition: service_completed_successfully
      api-gw:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  backend_host:
    container_name: vpt-host
    build:
      context: ../..
      dockerfile: backend_host/Dockerfile
    image: ${VPT_REGISTRY:-ghcr.io/angelstreetcorp}/virtualpytest-host:${VPT_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      HOST_NAME: ${HOST_NAME:-docker-host}
      HOST_PORT: "6109"
      HOST_BIND_IP: 0.0.0.0
      HOST_URL: http://${PUBLIC_HOST:-localhost}:6109
      HOST_API_URL: http://backend_host:6109
      SERVER_URL: http://backend_server:5109
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-virtualpytest}
      # No nginx in the container: Flask serves /host/stream/*, websockify serves noVNC
      HOST_VIDEO_STREAM_PATH: /host/stream/capture
      HOST_VNC_STREAM_PATH: http://${PUBLIC_HOST:-localhost}:6080/vnc_lite.html
      HOME: /home/vpt_user
      ANDROID_HOME: /home/vpt_user/.android
      ADB_VENDOR_KEYS: /home/vpt_user/.android
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
      XDG_RUNTIME_DIR: /tmp/.chromium
    volumes:
      # Device / capture configuration (created from .env.example by launch.sh)
      - ../../backend_host/src/.env:/app/backend_host/src/.env:ro
      - ../../test_scripts:/app/test_scripts:ro
      - ../../test_campaign:/app/test_campaign:ro
      - stream-data:/var/www/html/stream
    ports:
      - "6109:6109"
      - "6080:6080"
    depends_on:
      backend_server:
        condition: service_healthy

  frontend:
    container_name: vpt-frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: ${VPT_REGISTRY:-ghcr.io/angelstreetcorp}/virtualpytest-frontend:${VPT_IMAGE_TAG:-local}
    restart: unless-stopped
    # Passed at RUNTIME, not as build args: the entrypoint writes dist/config.js from these
    # on every start, so changing PUBLIC_HOST needs a restart rather than a rebuild — and
    # one published image serves any address.
    environment:
      VITE_SERVER_URL: http://${PUBLIC_HOST:-localhost}:5109
      VITE_GRAFANA_URL: http://${PUBLIC_HOST:-localhost}:3000
      VITE_CLOUDFLARE_R2_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:9000/${MINIO_BUCKET:-virtualpytest}
      # Empty = open mode (no login). To enforce auth see docs/get-started/supabase.md
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_PROJECT_NAME: ${VITE_PROJECT_NAME:-VirtualPyTest}
    ports:
      - "5073:5073"
    depends_on:
      backend_server:
        condition: service_started

  grafana:
    container_name: vpt-grafana
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/grafana_entrypoint.sh"]
    volumes:
      - ./grafana/grafana_entrypoint.sh:/grafana_entrypoint.sh:ro
      - grafana-data:/var/lib/grafana
      - ../../infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Read-only role created by db-init; the datasource uid is `supabase-postgres`
      SUPABASE_DB_URI: postgresql://grafana_reader:${GRAFANA_DB_PASSWORD}@db:5432/postgres
      GRAFANA_DS_SSLMODE: disable
      GRAFANA_ENABLE_DASHBOARD_PROVISIONING: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST:-localhost}:3000
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  redis-data:
  minio-data:
  stream-data:
  grafana-data:
