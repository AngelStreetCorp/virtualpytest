##
# VirtualPyTest Production HTTPS Configuration
# Complete self-contained nginx config for production with SSL
##

# =============================================================================
# SERVICE CONFIGURATION - Edit IPs here only
# =============================================================================

# Reverse Proxy IP (nginx server ip - used for access URL display)
# REVERSE_PROXY_IP: your-domain.com

# Frontend (React app)
upstream frontend {
    server 127.0.0.1:5073;
    # Proxmox example: server 192.168.x.105:5073;
}

# Backend Server (Flask API)
upstream backend_server {
    server 127.0.0.1:5109;
    # Proxmox example: server 192.168.x.103:5109;
}

# Grafana Monitoring
upstream grafana {
    server 127.0.0.1:3000;
    # Proxmox example: server 192.168.x.106:3000;
}

# MinIO Storage (optional)
upstream minio {
    server 127.0.0.1:9000;
    # Proxmox example: server 192.168.x.101:9000;
}

# Backend Host mapping for /host/{name}/ routing
map $host_identifier $backend_host_ip {
    default         "127.0.0.1";
    "localhost"     "127.0.0.1";
    # Proxmox example:
    # "pi1"         "192.168.x.140";
    # "pi2"         "192.168.x.141";
}

map $host_identifier $backend_host_port {
    default         "6109";
}

# Mobile-app phone pairing (TASK-19): throttle connection attempts against the phone
# Socket.IO endpoint per source IP. This is IP-based only - the pairing token/device_secret
# travel inside the first Socket.IO message, not the connection URL, so nginx cannot validate
# them here; this zone just bounds how fast one IP can hammer the endpoint (docs/tasks/
# TASK-19-mobile-app-public-pairing-hardening.md P0 #1).
limit_req_zone $binary_remote_addr zone=phone_socketio:10m rate=10r/s;

# =============================================================================
# VNC / STREAM ACCESS GATE  (see docs/security/STREAM_ACCESS_GATE.md for the
# full writeup, why both layers exist, and what breaks if either is removed)
# =============================================================================
# Two independent layers protect the device console AND the live/archive video
# feed (BUG-0107). Left open, a plain WS upgrade to /host/<name>/websockify
# answers "101 Switching Protocols" and a live RFB handshake with no session at
# all, and an HLS manifest under /host/<name>/stream/ is just as reachable by
# anyone who can guess or leak the URL.
#
# Layer 1 - network allowlist (below, VNC paths only). Cheap, coarse, and NOT
# sufficient on its own for a public deployment: a real customer has no fixed
# IP to allowlist, and widening this to arbitrary IPs is the same "allow all"
# hole it exists to close.
#
# Layer 2 - auth_request (added to every location below that serves VNC or HLS
# stream). Requires a short-lived HttpOnly cookie minted by the authenticated
# frontend at POST /server/host-session/session, validated per-request by
# GET /server/host-session/authorize (backend_server/src/routes/
# server_host_session_routes.py). THIS is the layer that must stay in place
# for a public/customer deployment - it is what actually stops an outsider
# with a leaked or guessed URL, independent of network origin. Removing the
# `auth_request` line from any location below reopens that exact location to
# the open internet even if Layer 1 is also in place, because Layer 1 does
# not cover /stream/ at all.
#
# /host/<name>/phone/socket.io/ is deliberately NOT part of this gate (see the
# comment on that location, TASK-19, 2026-09-16): its client is the native
# phone_agent app, which holds neither this cookie nor the service API key -
# only its own pairing token/device_secret, checked one layer down in
# features/mobile-app/backend_host/bridge.py's `hello` handler.
#
# $remote_addr must be the REAL client for Layer 1. Behind a CDN it is the edge
# IP, and an allowlist on it then matches every visitor alike - uncomment the
# real_ip block below (and keep the origin firewalled to the CDN, otherwise the
# header it trusts can simply be forged).
#
#   set_real_ip_from 173.245.48.0/20;   # ... one line per CDN range
#   real_ip_header   CF-Connecting-IP;
#
geo $vnc_client_allowed {
    default        0;
    127.0.0.1      1;
    192.168.0.0/16 1;
    # Add each operator egress / VPN exit IP that may open a device console:
    # 203.0.113.10 1;
}

# =============================================================================
# HTTP TO HTTPS REDIRECT
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dev.virtualpytest.com virtualpytest.com *.virtualpytest.com;
    return 301 https://$host$request_uri;
}

# =============================================================================
# HTTPS SERVER
# =============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.virtualpytest.com virtualpytest.com *.virtualpytest.com;

    # SSL Configuration (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/virtualpytest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtualpytest.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html;
    index index.html index.htm;

    # Security headers for production
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optimize for HLS streaming
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/vnd.apple.mpegurl;

    # =========================================================================
    # FRONTEND PROXY
    # =========================================================================

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # BACKEND SERVER API
    # =========================================================================

    location /server/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Socket.IO WebSocket proxies
    location ~ ^/server/.*socket\.io/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location ~ ^/socket\.io/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location ~ ^/agent/socket\.io/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # =========================================================================
    # HOST SESSION AUTH GATE (Layer 2, see "VNC / STREAM ACCESS GATE" above)
    # =========================================================================
    # Internal-only target for the `auth_request` lines below. Never call this
    # directly - nginx rejects external requests to it (`internal;`). It is a
    # plain reverse proxy to the same backend_server every other /server/
    # request already uses; the `Host` header is required or the app's own
    # host-trust check answers 400 (nginx defaults to the upstream block's
    # name, not the real host).
    location = /server/host-session/authorize {
        internal;
        proxy_pass http://backend_server/server/host-session/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # =========================================================================
    # BACKEND HOST APIs (uses map from SERVICE CONFIGURATION)
    # =========================================================================

    location ~ ^/host/([^/]+)/api/ {
        set $host_identifier $1;

        proxy_pass http://$backend_host_ip:$backend_host_port/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
    }

    # Mobile-app phone link (TASK-17): WebSocket-upgraded Socket.IO proxy for a paired
    # phone's live control channel (frames + tap/swipe/key/text commands). The /api/
    # block above cannot be reused for this — it sends no Upgrade headers (so Socket.IO
    # can never open a WebSocket, only long-poll) and rewrites the URI to "/", which
    # would drop Socket.IO's own /socket.io/ path entirely.
    #
    # Deliberately NOT gated with the host-session auth_request (TASK-19, 2026-09-16):
    # that cookie/API-key gate covers a logged-in browser or the two known
    # server-to-server callers (server_host_session_routes.py) - the phone_agent Android
    # app is neither. It only ever speaks the pairing token / device_secret protocol
    # over the first Socket.IO `hello` message, which nginx cannot see before the WS
    # upgrade. Gating this location the same way as VNC/HLS 401s every real phone that
    # isn't on the host's LAN (verified live 2026-09-16: a request shaped like the
    # phone's own connection got 401 from /server/host-session/authorize). The real
    # per-device check happens one layer down inside `hello`
    # (features/mobile-app/backend_host/bridge.py); `limit_req` below plus that
    # handler's own hello-lockout are this location's protection instead.
    location ~ ^/host/([^/]+)/phone/socket\.io/(.*)$ {
        set $host_identifier $1;
        limit_req zone=phone_socketio burst=20 nodelay;

        proxy_pass http://$backend_host_ip:$backend_host_port/socket.io/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # =========================================================================
    # VIDEO STREAMING
    # =========================================================================

    # Serve running.log directly from backend host hot storage (bypasses Flask content-type checks)
    location ~ ^/host/([^/]+)/stream/([^/]+)/hot/(running\.log)$ {
        set $host_identifier $1;
        set $device_folder $2;
        set $hot_file $3;
        auth_request /server/host-session/authorize;

        proxy_pass http://$backend_host_ip:8083/$device_folder/hot/$hot_file;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Wildcard is correct HERE and nowhere else under stream/: this one proxies to a
        # plain file server on :8083, not the host Flask app, so no upstream sets CORS and
        # there is nothing to pass through. The consequence is that this path cannot serve
        # a credentialed cross-origin caller (the mobile app reading running.log) — it
        # would need its own origin allow-list here. Not a regression; it has always been
        # so, and unlike the manifest/segments it is not on the streaming path (BUG-0143).
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0;
            return 204;
        }
    }

    # Proxy stream requests to backend host Flask (serves from /var/www/html/stream/)
    # Works regardless of whether proxy is colocated or remote
    #
    # NOTE (BUG-0143): do NOT add `proxy_hide_header Access-Control-Allow-Origin` +
    # `add_header Access-Control-Allow-Origin "*"` here. The live proxy once did, to put a
    # CORS header on error responses (BUG-0101) — but this path is behind the host-session
    # gate, and a client that has to send that cookie fetches with credentials, for which a
    # browser rejects a wildcard allow-origin outright, whatever the status. That silently
    # locked the mobile app out of every stream: the backend host answers correctly (it
    # echoes an allow-listed caller's origin via cors_allowed_origins()) and nginx replaced
    # it with `*`. The app already sets CORS headers on its own errors, which is what
    # BUG-0101 actually needed, so letting the upstream header through covers both.
    location ~ ^/host/([^/]+)/stream/(.+)$ {
        set $host_identifier $1;
        set $stream_path $2;
        auth_request /server/host-session/authorize;

        proxy_pass http://$backend_host_ip:$backend_host_port/stream/$stream_path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # VNC & REMOTE ACCESS (uses map from SERVICE CONFIGURATION)
    # =========================================================================

    location ~ ^/host/([^/]+)/vnc_lite\.html {
        # Layer 1 + Layer 2, see "VNC / STREAM ACCESS GATE" above.
        if ($vnc_client_allowed = 0) { return 403; }
        set $host_identifier $1;
        auth_request /server/host-session/authorize;

        proxy_pass http://$backend_host_ip:6080/vnc_lite.html$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;

        # Allow VNC to be embedded in iframes
        proxy_hide_header X-Frame-Options;
    }

    location ~ ^/host/([^/]+)/vnc/(.*)$ {
        # Layer 1 + Layer 2, see "VNC / STREAM ACCESS GATE" above.
        if ($vnc_client_allowed = 0) { return 403; }
        set $host_identifier $1;
        set $vnc_path $2;
        auth_request /server/host-session/authorize;

        proxy_pass http://$backend_host_ip:6080/vnc/$vnc_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/host/([^/]+)/websockify {
        # Layer 1 + Layer 2, see "VNC / STREAM ACCESS GATE" above.
        if ($vnc_client_allowed = 0) { return 403; }
        set $host_identifier $1;
        auth_request /server/host-session/authorize;

        proxy_pass http://$backend_host_ip:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Upgrade, Connection" always;

        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # =========================================================================
    # GRAFANA PROXY
    # =========================================================================

    location /grafana/ {
        proxy_pass http://grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        proxy_pass http://grafana/api/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # =========================================================================
    # MINIO STORAGE (optional)
    # =========================================================================

    location /minio/ {
        proxy_pass http://minio/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # =========================================================================
    # HEALTH & STATUS
    # =========================================================================


    # CI/CD Playwright Reports - served directly from runner local storage
    location /ci-reports/ {
        alias /opt/ci-reports/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # NOTE: nginx's internal metrics endpoint (stub_status) — deliberately NOT at
    # /status: the React SPA has a client-side route at /status (frontend/src/App.tsx),
    # and this location block, matching first, was intercepting a full page load/
    # refresh of that route (deny all -> 403 Forbidden for anyone off the LAN)
    # before it ever reached the SPA's history-mode fallback.
    location /_nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        deny all;
    }
}
