# Live-stream cache for the remote Pis (vpt-pi*, vpt-nipogi, vpt-mf1) on the proxy VM. NOT a standalone config: two
# pieces of the proxy's sites-enabled/virtualpytest, kept here for review. See infra/proxy/nginx/README.md
# ("Remote Pi live-stream cache") for what it fixes, where each piece goes, how to apply and roll back.
#
# --- 1. http level: top of the file, before "upstream rpitest_origin {" ---------------------------------------
# Remote Pi live stream: the HLS segments those hosts serve over their home uplink. A segment name is never reused
# (segment_<9-digit counter>, continued across ffmpeg restarts), so a cached segment never goes stale. Playlists are NOT
# cached: nginx cache lifetimes are whole seconds, and a 1 s playlist lived 1-2 s, putting every viewer up to 2 s behind
# live (the Pi writes a new 0.4 s segment 2.5 times a second). ~30 KB/s per watched device, 1 GB is plenty.
proxy_cache_path /var/cache/nginx/vpt-pistream levels=1:2 keys_zone=vpt_pistream:10m max_size=1g inactive=10m use_temp_path=off;


# --- 2. inside each server block that has the /host/.../stream/ gate (virtualpytest + virtualpytest-demo),
#        immediately BEFORE the "# Stream auth gate" comment, so these regexes win over the generic stream ones ----
 # Remote Pi live stream cache: same gate and upstream as the Pi stream location below, plus a read-through cache
 # (proxy_cache_path vpt_pistream at the top of this file). Only live segments (segments/segment_N.ts), 2 min; the
 # first viewer pulls one from the Pi, every other viewer of the same device gets it from here. Playlists go through
 # the generic Pi location below, uncached. The key carries the Origin
 # because the host echoes it in Access-Control-Allow-Origin (Vary: Origin). The host's no-cache headers are ignored
 # for this cache only and still reach the browser. add_header is deliberately not used (it would drop the
 # server-level security headers).
 location ~ ^/host/(vpt-pi[0-9]+|vpt-nipogi|vpt-mf1)/stream/(.+/segments/segment_[0-9]+\.ts)$ {
     set $pi_name $1;
     set $stream_path $2;
     auth_request /server/host-session/authorize;

     proxy_pass https://rpitest_origin/host/$pi_name/stream/$stream_path;
     proxy_ssl_name rpitest.angelstreet.io;
     proxy_http_version 1.1;
     proxy_set_header Connection "";
     proxy_ssl_server_name on;
     proxy_ssl_verify off;
     proxy_set_header Host rpitest.angelstreet.io;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto https;
     proxy_read_timeout 60s;
     proxy_connect_timeout 10s;
     proxy_cache vpt_pistream;
     proxy_cache_key "$http_origin|$uri";
     proxy_cache_valid 200 2m;
     proxy_cache_lock on;
     proxy_cache_lock_timeout 5s;
     proxy_ignore_headers Cache-Control Expires;
 }
