##
# VirtualPyTest Proxmox VM Configuration
# Pre-configured for Proxmox VM deployment
##

# =============================================================================
# SERVICE CONFIGURATION - Edit IPs here only
# =============================================================================

# Reverse Proxy IP (nginx server ip - used for access URL display)
# REVERSE_PROXY_IP: 192.168.x.107

# Frontend (React app)
upstream frontend {
    server 192.168.x.105:5073;
}

# Backend Server (Flask API)
upstream backend_server {
    server 192.168.x.103:5109;
}

# Grafana Monitoring
upstream grafana {
    server 192.168.x.106:3000;
}

# MinIO Storage
upstream minio {
    server 192.168.x.101:9000;
}

# MinIO Console (Web Interface)
upstream minio_console {
    server 192.168.x.101:9001;
}

# Supabase Studio (Web Interface)
# NOTE: Supabase Studio does not support subpath proxying.
# Accessible via separate SSL port: https://$host:54323
# The /supabase path redirects users to the SSL port.
# IMPORTANT: Both upstreams must point to the database VM (192.168.x.102).
# The storage VM (192.168.x.101) runs MinIO + Redis ONLY — no Supabase.
upstream supabase {
    server 192.168.x.102:54323;
}

# Supabase API (GoTrue/PostgREST) — same database VM
upstream supabase_api {
    server 192.168.x.102:54321;
}

# Redis Commander Web Interface
upstream redis {
    server 192.168.x.101:8081;
}

# Backend Host mapping for /host/{name}/ routing
map $host_identifier $backend_host_ip {
    default         "192.168.x.108";
    "localhost"     "192.168.x.108";
    "host"         "192.168.x.108";
    # Add more hosts:
    # "host2"       "192.168.x.201";
}

map $host_identifier $backend_host_port {
    default         "6109";
}

# =============================================================================
# HTTP TO HTTPS REDIRECT
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# =============================================================================
# HTTPS SERVER
# =============================================================================

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # SSL Configuration (self-signed certificates)
    ssl_certificate /etc/ssl/virtualpytest/virtualpytest.crt;
    ssl_certificate_key /etc/ssl/virtualpytest/virtualpytest.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html;
    index index.html index.htm;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optimize for HLS streaming
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/vnd.apple.mpegurl;


    # =========================================================================
    # STATIC DOCS - Security reports & API reference (proxy to frontend)
    # Explicit rules BEFORE SPA fallback to prevent rewriting
    # =========================================================================

    # /docs static files - proxy to frontend, no SPA rewrite
    location ~* ^/docs/.*\.(html|json|md)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No cache for docs
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
    }

    # /docs directory listing or index
    location /docs/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # =========================================================================
    # ASSET CACHING - Long cache for hashed assets, no-cache for HTML/JSON
    # =========================================================================

    # Hashed static assets (JS, CSS) - long cache (1 year)
    location ~* ^/assets/.*\.(js|css)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # =========================================================================
    # FRONTEND PROXY
    # =========================================================================

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    

    # =========================================================================
    # BACKEND SERVER API
    # =========================================================================

    location /server/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Socket.IO WebSocket proxies
    location ~ ^/server/.*socket\.io/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location ~ ^/socket\.io/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location ~ ^/agent/socket\.io/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # =========================================================================
    # BACKEND HOST APIs (uses map from SERVICE CONFIGURATION)
    # =========================================================================

    location ~ ^/host/([^/]+)/api/ {
        set $host_identifier $1;

        proxy_pass http://$backend_host_ip:$backend_host_port/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
    }

    # Mobile-app phone link (TASK-17): WebSocket-upgraded Socket.IO proxy for a paired
    # phone's live control channel (frames + tap/swipe/key/text commands). The /api/
    # block above cannot be reused for this — it sends no Upgrade headers (so Socket.IO
    # can never open a WebSocket, only long-poll) and rewrites the URI to "/", which
    # would drop Socket.IO's own /socket.io/ path entirely.
    location ~ ^/host/([^/]+)/phone/socket\.io/(.*)$ {
        set $host_identifier $1;

        proxy_pass http://$backend_host_ip:$backend_host_port/socket.io/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # =========================================================================
    # VIDEO STREAMING
    # =========================================================================

    # Serve running.log directly from backend host hot storage (bypasses Flask content-type checks)
    location ~ ^/host/([^/]+)/stream/([^/]+)/hot/(running\.log)$ {
        set $host_identifier $1;
        set $device_folder $2;
        set $hot_file $3;

        proxy_pass http://$backend_host_ip:8083/$device_folder/hot/$hot_file;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0;
            return 204;
        }
    }

    # Proxy stream requests to backend host Flask (serves from /var/www/html/stream/)
    # Works regardless of whether proxy is colocated or remote
    location ~ ^/host/([^/]+)/stream/(.+)$ {
        set $host_identifier $1;
        set $stream_path $2;

        proxy_pass http://$backend_host_ip:$backend_host_port/stream/$stream_path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # VNC & REMOTE ACCESS (uses map from SERVICE CONFIGURATION)
    # =========================================================================

    location ~ ^/host/([^/]+)/vnc_lite\.html {
        set $host_identifier $1;

        proxy_pass http://$backend_host_ip:6080/vnc_lite.html$is_args$args;
        proxy_ssl_verify off;  # For self-signed cert
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;

        # Allow VNC to be embedded in iframes
        proxy_hide_header X-Frame-Options;
    }

    # noVNC static files (explicit directories - secure)
    location ~ ^/host/([^/]+)/(core|vendor|include|app|utils)/(.*)$ {
        set $host_identifier $1;
        set $novnc_dir $2;
        set $novnc_file $3;

        proxy_pass http://$backend_host_ip:6080/$novnc_dir/$novnc_file;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/host/([^/]+)/vnc/(.*)$ {
        set $host_identifier $1;
        set $vnc_path $2;

        proxy_pass http://$backend_host_ip:6080/$vnc_path$is_args$args;
        proxy_ssl_verify off;  # For self-signed cert
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/host/([^/]+)/websockify {
        set $host_identifier $1;

        proxy_pass http://$backend_host_ip:6080/websockify;
        proxy_ssl_verify off;  # For self-signed cert
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Upgrade, Connection" always;

        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # =========================================================================
    # GRAFANA PROXY
    # =========================================================================

    location /grafana/ {
        proxy_pass http://grafana/grafana/;   
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /grafana; 
	    proxy_redirect off;
    }

    location /grafana/api/live/ {
        proxy_pass http://grafana/api/live/; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # =========================================================================
    # MINIO STORAGE
    # =========================================================================

    location /minio/ {
        proxy_pass http://minio/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # =========================================================================
    # MINIO CONSOLE (WEB INTERFACE)
    # =========================================================================

    location /minio-console/ {
        proxy_pass http://minio_console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /minio-console;
    }

    # MinIO Console WebSocket support
    location /minio-console/ws/ {
        proxy_pass http://minio_console/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # =========================================================================
    # SUPABASE STUDIO (WEB INTERFACE)
    # =========================================================================

    # Supabase Studio accessible via separate SSL port: https://$host:54323
    # /supabase path redirects to the SSL port for convenience
    location = /supabase {
        return 302 https://$host:54323/project/default;
    }

    location = /supabase/ {
        return 302 https://$host:54323/project/default;
    }

    # =========================================================================
    # REDIS WEB INTERFACE
    # =========================================================================

    location /redis/ {
        proxy_pass http://redis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # HEALTH & STATUS
    # =========================================================================


    # CI/CD Playwright Reports - served directly from runner local storage
    location /ci-reports/ {
        alias /opt/ci-reports/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # NOTE: nginx's internal metrics endpoint (stub_status) — deliberately NOT at
    # /status: the React SPA has a client-side route at /status (frontend/src/App.tsx),
    # and this location block, matching first, was intercepting a full page load/
    # refresh of that route (deny all -> 403 Forbidden for anyone off the LAN)
    # before it ever reached the SPA's history-mode fallback.
    location /_nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 192.168.x.0/16;
        deny all;
    }
}

# =============================================================================
# SUPABASE STUDIO - DEDICATED SSL PORT
# =============================================================================
# Supabase Studio (Next.js) requires root path access.
# Access via: https://$host:54323 or redirect from /supabase

server {
    listen 54323 ssl;
    listen [::]:54323 ssl;
    server_name _;

    # SSL Configuration (same certificates as main server)
    ssl_certificate /etc/ssl/virtualpytest/virtualpytest.crt;
    ssl_certificate_key /etc/ssl/virtualpytest/virtualpytest.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Proxy all requests to Supabase Studio
    location / {
        proxy_pass http://supabase;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Supabase Studio
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
