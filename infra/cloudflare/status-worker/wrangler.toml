name = "vpt-status-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Cron trigger — minute-by-minute origin probe.
[triggers]
crons = ["*/1 * * * *"]

# Plain (non-secret) vars. Secrets (RESEND_API_KEY + RESEND_TO_ADDRESS) are
# set per-env via `wrangler secret put ...` (see README).
[vars]
ORIGIN_URL            = "https://virtualpytest.angelstreet.io"
HEALTH_PATH           = "/server/health"
ALERT_AFTER_FAILURES  = "2"
RESEND_FROM_ADDRESS   = "noreply@virtualpytest.com"
RESEND_FROM_NAME      = "VirtualPyTest"

# KV namespace — create once with:
#   wrangler kv:namespace create STATUS_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "STATUS_KV"
id = "ae56a0b611f4400e93b6a21e30114c07"

# DO NOT bind a route on this Worker. Visitor traffic must reach proxmox
# directly (browser → CF edge → tunnel → nginx → backend). Proxying through
# the Worker burns the 100,000 requests/day Free-plan limit and the site
# goes back to Error 1027 within hours — see BUG-0570. The "temporarily
# unavailable" page is provided separately via CF dashboard → Custom Pages
# → 500_errors, sourced from `infra/cloudflare/custom-pages/5xx-error.html`.
#
# The earlier route binding history (`virtualtest.angelstreet.io/*` typo,
# then `virtualpytest.angelstreet.io/*`) is preserved in BUG-0554; the
# fix there was the dashboard route edit, not a wrangler [[routes]] entry.
# [[routes]]
# pattern = "virtualpytest.angelstreet.io/*"
# zone_name = "angelstreet.io"