# stb-aliases.conf — short aliases for the 2 paired STBs on vpt-mf1
#
# One row per STB, fields pipe-separated:
#   <alias>|<hciN>|<peer-MAC>|<description>
#
# Used by vpt-ble-sendkey-test.sh --list and the implicit resolve path
# when an alias (not a MAC) is supplied. The MAC must match the peer the
# adapter is bonded to under /var/lib/bluetooth/<SPOOF_MAC>/<PEER_MAC>/info.
#
# The 'alias' literal in column 1 is a header marker — keep one row that
# starts with 'alias' for grep-friendly ad-hoc parsing. Comment lines start
# with '#'.
#
# On the inventory host the live peers are:
#   hci1  -> 20:F3:75:8E:27:24 (STB-A, AUTH ENCRYPT, hid_ready=true,
#                                2a4d subscribed)
#   hci2  -> A0:E7:AE:FF:19:22 (STB-B, AUTH ENCRYPT, hid_ready=false
#                                — STB likely in standby, will wake
#                                after POWER press via sendkey)
#
# If you re-pair either STB, update the MAC column here. The hourly probe
# does NOT read this file (it walks /var/lib/bluetooth/ directly), so a
# stale row only affects the manual sendkey path.

alias|adapter|peer|description
stb-A|hci1|20:F3:75:8E:27:24|STB-A — bonded to hci1, 2a4d subscribed
stb-B|hci2|A0:E7:AE:FF:19:22|STB-B — bonded to hci2, idle (no 2a4d until next wake)
