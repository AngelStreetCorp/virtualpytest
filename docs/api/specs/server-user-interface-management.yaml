openapi: 3.0.0
info:
  title: SERVER - User Interface Management
  version: 1.0.0
  description: UI definition management
servers:
  - url: '{server_url}'
    description: Environment base URL
    variables:
      server_url:
        default: 'https://your-server.example.com'
        description: Backend server URL (use dev/staging/prod base URL)
x-postman-variables:
  - key: server_url
    value: 'http://localhost:5109'
    description: Backend server URL
  - key: team_id
    value: 'team_123'
    description: Team identifier
  - key: jwt_token
    value: 'your_jwt_token_here'
    description: JWT bearer token for authorization
  - key: userinterface_id
    value: 'ui_001'
    description: User interface identifier
  - key: userinterface_name
    value: 'example_mobile'
    description: User interface name
paths:
  /server/userinterface/getAllUserInterfaces:
    get:
      summary: Get All User Interfaces
      description: Get a list of all user interface definitions for a team
      tags: [UserInterface]
      parameters:
        - name: team_id
          in: query
          required: true
          schema:
            type: string
          description: Team identifier
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: Optional in open mode. Required when ENFORCE_FRONTEND_JWT=true and SUPABASE_JWT_SECRET is configured.
      responses:
        '200':
          description: List of user interfaces retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    models:
                      type: array
                      items:
                        type: string
  /server/userinterface/createUserInterface:
    post:
      summary: Create User Interface
      description: Create a new user interface definition
      tags: [UserInterface]
      parameters:
        - name: team_id
          in: query
          required: true
          schema:
            type: string
          description: Team identifier
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: Optional in open mode. Required when ENFORCE_FRONTEND_JWT=true and SUPABASE_JWT_SECRET is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - models
              properties:
                name:
                  type: string
                  description: User interface name (must be unique)
                models:
                  type: array
                  description: List of compatible device models (at least one required)
                  items:
                    type: string
                description:
                  type: string
                  description: User interface description (optional)
                capabilities:
                  type: object
                  description: Interface capabilities (optional)
            example:
              name: "{{userinterface_name}}"
              models: ["Samsung S21", "Samsung S22"]
              description: "Android mobile interface for Samsung devices"
              capabilities:
                touch: true
                voice: false
      responses:
        '201':
          description: User interface created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  userinterface:
                    type: object
        '400':
          description: Bad request - name is required, duplicate name, or no models selected
        '500':
          description: Failed to create user interface
  /server/userinterface/getUserInterface/{interface_id}:
    get:
      summary: Get User Interface by ID
      description: Retrieve a specific user interface by its ID
      tags: [UserInterface]
      parameters:
        - name: interface_id
          in: path
          required: true
          schema:
            type: string
          description: User interface identifier
        - name: team_id
          in: query
          required: true
          schema:
            type: string
          description: Team identifier
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: Optional in open mode. Required when ENFORCE_FRONTEND_JWT=true and SUPABASE_JWT_SECRET is configured.
      responses:
        '200':
          description: User interface details retrieved successfully
          content:
            application/json:
              schema:
                type: object
        '404':
          description: User interface not found
  /server/userinterface/updateUserInterface/{interface_id}:
    put:
      summary: Update User Interface
      description: Update an existing user interface definition
      tags: [UserInterface]
      parameters:
        - name: interface_id
          in: path
          required: true
          schema:
            type: string
          description: User interface identifier
        - name: team_id
          in: query
          required: true
          schema:
            type: string
          description: Team identifier
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: Optional in open mode. Required when ENFORCE_FRONTEND_JWT=true and SUPABASE_JWT_SECRET is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: User interface name
                  example: "Updated Mobile Interface"
                models:
                  type: array
                  description: List of compatible device models
                  items:
                    type: string
                  example: ["Samsung S21", "Samsung S22", "Samsung S23"]
                description:
                  type: string
                  description: User interface description
                  example: "Updated description"
                capabilities:
                  type: object
                  description: Interface capabilities
      responses:
        '200':
          description: User interface updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  userinterface:
                    type: object
        '400':
          description: Bad request - invalid data
        '404':
          description: User interface not found
        '500':
          description: Failed to update user interface
  /server/userinterface/deleteUserInterface/{interface_id}:
    delete:
      summary: Delete User Interface
      description: Delete a user interface definition permanently
      tags: [UserInterface]
      parameters:
        - name: interface_id
          in: path
          required: true
          schema:
            type: string
          description: User interface identifier
        - name: team_id
          in: query
          required: true
          schema:
            type: string
          description: Team identifier
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: Optional in open mode. Required when ENFORCE_FRONTEND_JWT=true and SUPABASE_JWT_SECRET is configured.
      responses:
        '200':
          description: User interface deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '404':
          description: User interface not found
        '500':
          description: Failed to delete user interface
