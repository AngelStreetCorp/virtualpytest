openapi: 3.0.0
info:
  title: SERVER - AI & Analysis
  version: 1.0.0
  description: AI-powered test generation and analysis
servers:
  - url: '{server_url}'
    description: Environment base URL
    variables:
      server_url:
        default: 'https://your-server.example.com'
        description: Backend server URL (use dev/staging/prod base URL)
x-postman-variables:
  - key: server_url
    value: 'http://localhost:5109'
    description: Backend server URL
  - key: team_id
    value: 'team_123'
    description: Team identifier
  - key: jwt_token
    value: 'your_jwt_token_here'
    description: JWT bearer token for authorization
  - key: host_name
    value: 'backend_host_1'
    description: Host name
  - key: device_id
    value: 'device_001'
    description: Device identifier
  - key: userinterface_name
    value: 'example_mobile'
    description: User interface name
  - key: task_id
    value: 'task_abc123'
    description: Task identifier
  - key: ai_prompt
    value: 'Navigate to settings and verify WiFi option'
    description: AI prompt text
paths:
  /server/ai/generatePlan:
    post:
      summary: Generate AI Execution Plan
      description: Generate a step-by-step execution plan from AI prompt
      tags: [AI]
      parameters:
        - name: team_id
          in: query
          required: false
          schema:
            type: string
          description: Team identifier (optional)
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: Optional in open mode. Required when ENFORCE_FRONTEND_JWT=true and SUPABASE_JWT_SECRET is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
                - host_name
              properties:
                prompt:
                  type: string
                  description: AI task prompt
                  example: "{{ai_prompt}}"
                host_name:
                  type: string
                  description: Host name where AI task will run
                  example: "{{host_name}}"
                device_id:
                  type: string
                  description: Device identifier (optional)
                  example: "device1"
                userinterface_name:
                  type: string
                  description: User interface name (optional)
                  example: "{{userinterface_name}}"
      responses:
        '200':
          description: Generated execution plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  plan:
                    type: object
                  steps:
                    type: array
                    items:
                      type: object
        '400':
          description: Bad request - missing required fields
  /server/ai/resetCache:
    post:
      summary: Reset AI Graph Cache
      description: Clear all cached AI-generated graphs for a team
      tags: [AI]
      parameters:
        - name: team_id
          in: query
          required: true
          schema:
            type: string
          description: Team identifier
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: Optional in open mode. Required when ENFORCE_FRONTEND_JWT=true and SUPABASE_JWT_SECRET is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - host_name
              properties:
                host_name:
                  type: string
                  description: Host name for cache invalidation
                  example: "{{host_name}}"
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  deleted_count:
                    type: integer
        '400':
          description: Bad request - missing host_name or team_id
