                  <img src="{rel_path}" alt="{name}">
                </a>
                <div class="label">{name}</div>
              </div>''')
          out.write_text(f"""<!DOCTYPE html><html lang="en"><head>
          <meta charset="utf-8"><title>Page Screenshots</title>
          <style>
            body{{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#1a1a1a;color:#eee}}
