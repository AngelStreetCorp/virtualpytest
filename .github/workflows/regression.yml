          GALLERY="tests/e2e/playwright/playwright-report/screenshots.html"
          if [ -d "$SHOTS_DIR" ] && [ "$(ls $SHOTS_DIR/*.png 2>/dev/null | wc -l)" -gt 0 ]; then
