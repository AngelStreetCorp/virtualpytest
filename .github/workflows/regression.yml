          fi
          echo '{"status":"${{ steps.run-e2e-pages.outcome }}","report":"e2e-pages","category":"browser"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/e2e-pages.json"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'e2e-pages', 'browser', 'grey', '${{ steps.run-e2e-pages.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/e2e-pages/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, report_url = EXCLUDED.report_url, finished_at = now();" || echo "::warning::ci_jobs insert failed"

      - name: Upload page screenshots
