  e2e-viewport:
    name: E2E Viewport Tests
    runs-on: [self-hosted, Linux, X64]
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'grey') && inputs.runner != 'github-hosted' }}
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/playwright/package-lock.json

      - name: Install E2E dependencies
        run: cd tests/e2e/playwright && npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/e2e/playwright/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd tests/e2e/playwright && ./node_modules/.bin/playwright install chromium --with-deps

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          max_retries=3
          for i in $(seq 1 $max_retries); do
            cd tests/e2e/playwright && ./node_modules/.bin/playwright install-deps chromium && break
            echo "Retry $i/$max_retries in 30s (transient apt timing issue)..."
            sleep 30
          done

      - name: Run E2E viewport suite
        id: run-e2e-viewport
        continue-on-error: true
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_AUTO_SIGN_TOKEN: ${{ secrets.E2E_AUTO_SIGN_TOKEN }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: tests/e2e/playwright/run_e2e_viewport.sh

      - name: Inject toolbar into Playwright report
        if: always()
        continue-on-error: true
        run: |
          python3 - << 'PYEOF'
          import pathlib
          idx = pathlib.Path("tests/e2e/playwright/playwright-report/index.html")
          if not idx.exists(): exit(0)
          toolbar = '''<div id="vpt-toolbar" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#1e1e2e;border-bottom:1px solid #444;display:flex;align-items:center;gap:8px;padding:6px 14px;font-family:system-ui,sans-serif;font-size:13px">
            <button onclick="history.back()" style="background:#333;color:#ccc;border:1px solid #555;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px">&#8592; Back</button>
            <span style="color:#666;font-size:11px;margin-left:auto">E2E Viewport Report</span>
          </div><div style="height:38px"></div>'''
          content = idx.read_text(encoding='utf-8')
          if 'vpt-toolbar' not in content:
              idx.write_text(content.replace('<body>', '<body>' + toolbar, 1), encoding='utf-8')
          PYEOF

      - name: Save report and job result
        if: ${{ always() }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"; KEY="$HOME/.ssh/ci_reports_key"; RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/e2e-viewport /opt/ci-reports/$RUN/jobs"
          if [ -d "tests/e2e/playwright/playwright-report" ]; then
            scp -i "$KEY" -o StrictHostKeyChecking=no -r tests/e2e/playwright/playwright-report/. "$SERVER:/opt/ci-reports/$RUN/e2e-viewport/"
          fi
          # Write meta.json fallback (this job has no needs: lint)
          ssh -i "$KEY" "$SERVER" "[ -f /opt/ci-reports/$RUN/meta.json ] || echo '{\"run\":$RUN,\"branch\":\"${{ github.ref_name }}\",\"sha\":\"${{ github.sha }}\",\"date\":\"$(date -u '+%Y-%m-%d %H:%M UTC')\"}' > /opt/ci-reports/$RUN/meta.json"
          echo '{"status":"${{ steps.run-e2e-viewport.outcome }}","report":"e2e-viewport","category":"browser"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/e2e-viewport.json"
          # ci_runs fallback, for the same reason as the meta.json fallback above: the run row is
          # written by the lint job, and this is the one job with no `needs: lint`, so it can finish
          # first — it did on runs 715 and 717, by 21s. ci_jobs has a foreign key on (project, run),
          # so the job row was rejected ("violates foreign key constraint ci_jobs_project_run_fkey")
          # and swallowed by the `|| echo ::warning`. The job ran and passed, its report uploaded,
          # and the dashboard still read 9/9 with e2e-viewport simply absent — a green job missing
          # from the scoreboard is worse than a red one. DO NOTHING, so lint's own insert stays
          # authoritative for trigger/suite/runner when it lands after this.
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_runs (project, run, run_number, branch, sha, report_url)
            VALUES ('virtualpytest', '$RUN', $RUN, '${{ github.ref_name }}', '${{ github.sha }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/')
            ON CONFLICT (project, run) DO NOTHING;" || echo "::warning::ci_runs fallback insert failed"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'e2e-viewport', 'browser', 'grey', '${{ steps.run-e2e-viewport.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/e2e-viewport/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, report_url = EXCLUDED.report_url, finished_at = now();" || echo "::warning::ci_jobs insert failed"

      - name: Upload viewport report artifact
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-viewport-report-${{ github.run_number }}
          path: tests/e2e/playwright/playwright-report/
          retention-days: 7

  web-script-local-debug:
    name: Web Script Local Debug (Python Playwright)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      ${{ !cancelled()
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (github.event_name != 'workflow_dispatch'
          || inputs.suite == 'all' || inputs.suite == 'grey')
      && inputs.runner != 'github-hosted' }}
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify Python 3.11 (system)
        run: python3.11 --version

      - name: Install Python dependencies for script framework
        run: |
          python -m pip install --upgrade pip --break-system-packages
          pip install --break-system-packages \
            Flask \
            Flask-Cors \
            requests \
            psutil \
            python-dotenv \
            boto3 \
            supabase \
            pydantic \
            typing-extensions \
            playwright \
            browser-use==0.7.1 \
            pydantic-settings
          # browser-use: same version as the web host (sample-app-web, 2026-09-08); without it
          # browser_task.py fails with "No module named 'browser_use'" (BUG-0067). 0.7.1
          # imports pydantic_settings but does not declare it, hence the explicit install.

      - name: Cache Python Playwright browsers
        id: playwright-python-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-python-chromium-v1

      - name: Install Playwright Chromium
        if: steps.playwright-python-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-python-cache.outputs.cache-hit == 'true'
        run: |
          max_retries=3
          for i in $(seq 1 $max_retries); do
            python -m playwright install-deps chromium && break
            echo "Retry $i/$max_retries in 30s (transient apt timing issue)..."
            sleep 30
          done

      - name: Install xvfb and Chromium for headless browser
        run: |
          max_retries=3
          for i in $(seq 1 $max_retries); do
            sudo apt-get update && sudo apt-get install -y xvfb chromium && break
            echo "Retry $i/$max_retries in 30s (transient apt timing issue)..."
            sleep 30
          done

      - name: Run web scripts in local-debug smoke mode
        id: run-scripts
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: xvfb-run --auto-servernum tests/test_scripts/run_web_local_debug.sh smoke 2>&1 | tee /tmp/script-output.txt; exit ${PIPESTATUS[0]}

      - name: Generate script HTML report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p script-report
          python3 - << 'PYEOF'
          import html, os, pathlib, datetime
          status = os.environ.get("SCRIPT_STATUS", "unknown")
          color = "#2e7d32" if status == "success" else "#c62828"
          label = "PASSED" if status == "success" else "FAILED"
          ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          try:
              raw = open("/tmp/script-output.txt").read()
          except Exception:
              raw = "No output captured"
          output = html.escape(raw[:30000])
          # List artifacts
          import subprocess
          try:
              artifacts = subprocess.check_output(["find", "tmp/local_debug", "-maxdepth", "3", "-type", "f"], text=True, stderr=subprocess.DEVNULL)
              artifacts_html = html.escape(artifacts or "No artifacts found")
          except Exception:
              artifacts_html = "No artifacts found"
          pathlib.Path("script-report/index.html").write_text(f"""<!DOCTYPE html><html lang="en"><head>
          <meta charset="utf-8"><title>Web Script Report</title>
          <style>body{{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#fafafa;color:#212121}}
          h1,h2{{margin:0 0 4px;font-size:1.5rem}}h2{{font-size:1.1rem;margin:20px 0 8px}}
          .meta{{color:#666;font-size:.85rem;margin-bottom:16px}}
          .badge{{display:inline-block;padding:4px 20px;border-radius:20px;font-weight:700;font-size:1.1rem;color:#fff;background:{color};margin-bottom:16px}}
          pre{{background:#263238;color:#eceff1;padding:20px;border-radius:8px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap;word-break:break-all}}</style>
          </head><body><h1>Web Script Local Debug Report</h1>
          <div class="meta">{ts}</div>
          <div class="badge">{label}</div>
          <h2>Output</h2><pre>{output}</pre>
          <h2>Artifacts</h2><pre>{artifacts_html}</pre>
          </body></html>""")
          print("script-report/index.html written")
          PYEOF
        env:
          SCRIPT_STATUS: ${{ steps.run-scripts.outcome }}

      - name: Save job result
        if: ${{ always() }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"; KEY="$HOME/.ssh/ci_reports_key"; RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/jobs /opt/ci-reports/$RUN/web-script-local-debug"
          if [ -d "script-report" ]; then
            scp -i "$KEY" -o StrictHostKeyChecking=no -r script-report/. "$SERVER:/opt/ci-reports/$RUN/web-script-local-debug/"
          fi
          echo '{"status":"${{ steps.run-scripts.outcome }}","report":"web-script-local-debug","category":"script"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/web-script-local-debug.json"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'web-script-local-debug', 'script', 'grey', '${{ steps.run-scripts.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/web-script-local-debug/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, report_url = EXCLUDED.report_url, finished_at = now();" || echo "::warning::ci_jobs insert failed"

      - name: Upload local-debug script artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: web-script-local-debug-artifacts-${{ github.run_number }}
          path: tmp/local_debug/
          if-no-files-found: warn
          retention-days: 7

  api-routes:
    name: API Route Sweep (Python)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      ${{ !cancelled()
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (github.event_name != 'workflow_dispatch'
          || inputs.suite == 'all' || inputs.suite == 'grey')
      && inputs.runner != 'github-hosted' }}
    needs: lint
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify Python 3.11 (system)
        run: python3.11 --version

      - name: Install dependencies
        run: pip install requests pyyaml --break-system-packages

      # Every GET route the server registers (its own url_map via /server/api-testing/config),
      # ids resolved from the list endpoints — no hand-written route list to fall behind.
      # Contract: 2xx/401/403 pass, 404 fails unless allow-listed, 5xx fails. Exact status/body
      # assertions live in backend-server-tests.
      - name: Run API route sweep
        id: run-api-tests
        continue-on-error: true
        env:
          SERVER_URL: ${{ secrets.E2E_BASE_URL }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python test_scripts/api/run_api_tests.py --discover

      - name: Save job result
        if: ${{ always() }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"; KEY="$HOME/.ssh/ci_reports_key"; RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/jobs /opt/ci-reports/$RUN/api-routes"
          if [ -d "api-report" ]; then
            scp -i "$KEY" -o StrictHostKeyChecking=no -r api-report/. "$SERVER:/opt/ci-reports/$RUN/api-routes/"
          fi
          echo '{"status":"${{ steps.run-api-tests.outcome }}","report":"api-routes","category":"api"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/api-routes.json"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'api-routes', 'api', 'grey', '${{ steps.run-api-tests.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/api-routes/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, report_url = EXCLUDED.report_url, finished_at = now();" || echo "::warning::ci_jobs insert failed"

  # The platform's own self-test scripts (TC050-TC054): hosts registered, host API
  # reachable, devices addressable, UI pages served, HLS pipeline alive. They run
  # through the real execute path (POST /server/script/execute, poll the task) —
  # they cannot run standalone here, because @script needs a host and a device.
  #
  # Added after two of the five (smoke_device_control, smoke_video_stream) were
  # found broken with no signal at all: nothing in CI had ever run them (BUG-0091).
  vpt-smoke:
    name: VPT Self-Test Smoke (Python)
    runs-on: [self-hosted, Linux, X64]
    if: >-
      ${{ !cancelled()
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (github.event_name != 'workflow_dispatch'
          || inputs.suite == 'all' || inputs.suite == 'grey')
      && inputs.runner != 'github-hosted' }}
    needs: lint
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify Python 3.11 (system)
        run: python3.11 --version

      - name: Install dependencies
        run: pip install requests --break-system-packages

      - name: Run VPT smoke scripts
        id: run-vpt-smoke
        continue-on-error: true
        env:
          SERVER_URL: ${{ secrets.E2E_BASE_URL }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python tests/test_scripts/run_vpt_smoke.py --json-out vpt-smoke.json

      - name: Generate smoke HTML report
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p vpt-smoke-report
          python3 - << 'PYEOF'
          import html, json, os

          data = {"results": []}
          if os.path.exists("vpt-smoke.json"):
              with open("vpt-smoke.json", encoding="utf-8") as handle:
                  data = json.load(handle)

          rows = []
          for r in data.get("results", []):
              colour = "#1a7f37" if r["ok"] else "#cf222e"
              detail = html.escape(str(r.get("detail") or ""))
              link = (f'<a href="{detail}">report</a>'
                      if detail.startswith("http") else detail)
              rows.append(
                  f'<tr><td style="color:{colour};font-weight:600">'
                  f'{"PASS" if r["ok"] else "FAIL"}</td>'
                  f'<td><code>{html.escape(r["script"])}</code></td>'
                  f'<td>{r.get("seconds", 0)}s</td><td>{link}</td></tr>'
              )

          passed = sum(1 for r in data.get("results", []) if r["ok"])
          total = len(data.get("results", []))
          with open("vpt-smoke-report/index.html", "w", encoding="utf-8") as handle:
              handle.write(
                  "<html><head><meta charset='utf-8'><title>VPT Self-Test Smoke</title>"
                  "<style>body{font:14px system-ui;margin:2rem}"
                  "table{border-collapse:collapse}td,th{padding:.4rem .8rem;"
                  "border-bottom:1px solid #d0d7de;text-align:left}</style></head><body>"
                  f"<h1>VPT Self-Test Smoke</h1><p>{passed}/{total} passed"
                  f" &middot; host <code>{html.escape(str(data.get('host')))}</code>"
                  f" device <code>{html.escape(str(data.get('device')))}</code></p>"
                  "<table><tr><th>Result</th><th>Script</th><th>Time</th><th></th></tr>"
                  + "".join(rows) + "</table></body></html>"
              )
          PYEOF

      - name: Save job result
        if: ${{ always() }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"; KEY="$HOME/.ssh/ci_reports_key"; RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/jobs /opt/ci-reports/$RUN/vpt-smoke"
          if [ -d "vpt-smoke-report" ]; then
            scp -i "$KEY" -o StrictHostKeyChecking=no -r vpt-smoke-report/. "$SERVER:/opt/ci-reports/$RUN/vpt-smoke/"
          fi
          echo '{"status":"${{ steps.run-vpt-smoke.outcome }}","report":"vpt-smoke","category":"script"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/vpt-smoke.json"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'vpt-smoke', 'script', 'grey', '${{ steps.run-vpt-smoke.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/vpt-smoke/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, report_url = EXCLUDED.report_url, finished_at = now();" || echo "::warning::ci_jobs insert failed"
