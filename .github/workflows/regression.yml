            .grid{{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}}
            .card{{background:#2a2a2a;border-radius:8px;overflow:hidden;border:1px solid #333}}
            .card img{{width:100%;height:140px;object-fit:cover;display:block;transition:opacity .2s}}
            .card img:hover{{opacity:.85}}
            .label{{padding:6px 10px;font-size:.78rem;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
          </style></head><body>
          <h1>Page Screenshots</h1>
          <div class="meta">{ts} &nbsp;|&nbsp; {len(shots)} pages</div>
          <div class="grid">{''.join(cards)}</div>
          </body></html>""")
          print(f"Gallery written: {len(shots)} screenshots")
          PYEOF
          fi
          # Inject floating toolbar into Playwright index.html (screenshots link + back btn)
          python3 - << 'PYEOF'
          import pathlib
