name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which layer to run'
        type: choice
        default: all
        options: [all, white, grey]
      runner:
        description: 'Where to run it'
        type: choice
        default: self-hosted
        options: [self-hosted, github-hosted]

permissions:
  contents: read

# Six self-hosted runners serve this repo (vpt-163-1..3 and vpt-164-1..3 — see
# docs/agent/execution/PERIODIC_TEST_RUN.md), so the fan-out below runs genuinely in
# parallel rather than queueing behind itself. This is still worth keeping: pushing a fix
# while an older commit's run is in flight just spends the fleet on checks of stale code —
# cancel the older one instead of running it to completion once a newer commit supersedes it.
# workflow_dispatch runs get a run_id-unique group so manual dispatches never cancel each other
# (e.g. one deliberately running 'white' while another runs 'grey'). Push runs use SHA as
# the group key so that duplicate triggers on the same SHA don't cancel each other (fixes
# the case where rapid pushes or duplicate events fire the workflow multiple times for one commit).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: true

env:
  # CI/CD results database (features/cicd/db/001_cicd_schema.sql) — separate from the VPT
  # database. LAN-only, so GitHub-hosted jobs publish through the ingest API instead.
  CICD_DATABASE_URL: ${{ secrets.CICD_DATABASE_URL }}
  CICD_INGEST_TOKEN: ${{ secrets.CICD_INGEST_TOKEN }}
  # Suite / runner are only set on a manual dispatch; a push run is 'all' on the LAN runner.
  CI_SUITE: ${{ inputs.suite || 'all' }}
  CI_RUNNER_TARGET: ${{ inputs.runner || 'self-hosted' }}
  CI_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.event_name }}

jobs:
  # Dependency bumps (Dependabot) had NO coverage: `backend-server-tests` installs only
  # pytest and then makes HTTP calls against the ALREADY-DEPLOYED server (SERVER_URL), so a
  # requirements.txt change went green without the new versions ever being installed. That is
  # how PRs #33/#35 (Flask 2.3->3.1, gunicorn 21->26, gevent 23->26) showed 10/10 green while
  # proving nothing about what they changed.
  #
  # This job closes the RESOLUTION half of that gap: the requirement set must actually install
  # together and import. It deliberately does NOT prove the app behaves — only booting it does,
  # which is what the Docker stack job covers. Scope honestly: "these deps resolve and load".
  #
  # Everything happens in a throwaway venv. The runners are shared self-hosted VMs, so a
  # `pip install --break-system-packages` of a new Flask major would mutate the box out from
  # under every other job and any service on it.
  backend-deps:
    name: Backend deps resolve and import (${{ matrix.component }})
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend_server, backend_host]
    steps:
      - uses: actions/checkout@v7

      - name: Install ${{ matrix.component }}/requirements.txt into an isolated venv
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/deps-${{ matrix.component }}-$GITHUB_RUN_ID"
          rm -rf "$VENV"
          python3.11 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip >/dev/null
          echo "::group::pip install"
          "$VENV/bin/pip" install -r "${{ matrix.component }}/requirements.txt"
          echo "::endgroup::"
          echo "$VENV" > "$RUNNER_TEMP/venv-path-${{ matrix.component }}"

      - name: pip check — no conflicting installed versions
        run: |
          set -euo pipefail
          VENV="$(cat "$RUNNER_TEMP/venv-path-${{ matrix.component }}")"
          "$VENV/bin/pip" check

      - name: Import the packages whose majors have broken us before
        run: |
          set -euo pipefail
          VENV="$(cat "$RUNNER_TEMP/venv-path-${{ matrix.component }}")"
          # Resolving is not loading: a wheel can install and still fail to import (C-extension
          # or Python-version mismatch). Both backends share this Flask/gevent stack.
          "$VENV/bin/python" - <<'PY'
          import importlib
          mods = ["flask", "flask_cors", "flask_socketio", "psutil", "gunicorn", "gevent", "requests"]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
                  print(f"  ok   {m}")
              except Exception as e:
                  print(f"  FAIL {m}: {type(e).__name__}: {e}")
                  failed.append(m)
          import flask, gevent
          print(f"\nflask={flask.__version__} gevent={gevent.__version__}")
          raise SystemExit(1 if failed else 0)
          PY

      - name: Clean up the venv
        if: always()
        run: rm -rf "$RUNNER_TEMP/deps-${{ matrix.component }}-$GITHUB_RUN_ID" || true   # a cancelled pip may still be writing here; never fail the job on cleanup

  # Runs FIRST and gates nothing else on purpose: the other jobs are about whether the code
  # works, this one is about whether the change is safe to have left the machine. It is the
  # server-side half of .githooks/pre-push — the hook can be bypassed (LEAK_GATE_SKIP=1) or
  # simply not installed on a given clone, so the same gate runs here where it cannot be.
  # Make it a required check on main once it has been green for a few runs.
  leak-gate:
    name: Leak Gate (identifiers + secrets)
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    # Opt OUT of the workflow-level concurrency group, which cancels in progress. That group is
    # right for the test fan-out (checking stale code wastes the fleet) and WRONG here: the gate
    # resolves its range from `github.event.before`, so the next push starts where this one
    # ended. Cancel this job and that range is never scanned by anything, by anyone, ever —
    # observed 2026-09-14, when a push queued behind busy runners was cancelled by the next
    # push and its four commits silently fell out of CI coverage entirely. Keyed per-SHA so
    # every pushed commit gets its own run; the job is ~1 min, so never cancelling is cheap.
    concurrency:
      group: leak-gate-${{ github.sha }}
      cancel-in-progress: false
    steps:
      # The gate scans a commit RANGE, so it needs both ends. A shallow clone has neither
      # the base commit nor the merge base, and the scan would silently cover nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            echo "gitleaks $(gitleaks version) already present"; exit 0
          fi
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Resolve the range this push/PR adds
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # First push of a branch (or a force-push whose 'before' is gone): compare
            # against the default branch instead of scanning back to the root commit.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git merge-base "$head" origin/main 2>/dev/null || echo '')"
            fi
          fi
          [ -z "$base" ] && base="$(git rev-parse "$head~1")"
          echo "range=${base}..${head}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${base}..${head}"

      - name: Run the leak gate
        env:
          # The real customer terms never live in the tree (docs/agent/release/ANONYMIZATION.md);
          # CI gets them from this secret. --require-terms makes a missing/emptied secret a
          # hard failure rather than a silently skipped check.
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
        run: ./scripts/security/leak_gate.sh --range "${{ steps.range.outputs.range }}" --require-terms

  # ------------------------------------------------------------------ install paths
  # The customer-facing Docker install must always build and come up. Runs on a
  # GitHub-hosted runner (the LAN runners have no Docker) with exactly the commands
  # docs/get-started/docker.md gives a user. TASK-15 §4.1.
  docker-build:
    name: Docker stack builds and starts
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'white' }}
    timeout-minutes: 45
    env:
      # env_file in compose resolves relative to compose file location
      # (setup/docker/), not CWD. The seed step copies .env there; set
      # COMPOSE_ENV_FILE to match so all compose commands (pre-pull, launch,
      # smoke, teardown) use the same path.
      COMPOSE_ENV_FILE: setup/docker/.env
    steps:
      - uses: actions/checkout@v7

      - name: "Seed .env in workdir so include: env_file: .env finds it"
        run: |
          # The docker-compose.yml include block has env_file: .env which resolves
          # env_file in compose resolves relative to compose file location
          # (setup/docker/), not CWD. launch.sh creates setup/docker/.env with real
          # secrets; pre-pull and smoke run before launch.sh, so seed the correct
          # path from .env.example so compose finds it.
          cp setup/docker/.env.example setup/docker/.env

      - name: Free disk space (images total ~9 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Pre-pull images (registries time out; a red run for a slow quay.io is noise)
        run: |
          for attempt in 1 2 3; do
            docker compose -f setup/docker/docker-compose.yml -f setup/docker/docker-compose.linux.yml --env-file setup/docker/.env pull --quiet && exit 0
            echo "pull attempt ${attempt} failed; retrying in 30s"; sleep 30
          done
          echo "::warning::image pre-pull failed three times — launch.sh will try once more"
      - name: Clean up stale containers and networks from previous runs
        run: |
          # Remove vpt-* containers (leftover from previous CI runs)
          docker ps -a --format '{{.Names}}' | grep '^vpt-' | xargs -r docker rm -f 2>/dev/null || true
          # Remove orphaned/duplicate virtualpytest_default networks (ambiguous network error
          # happens when two networks with the same name exist — remove all of them so
          # docker-compose can recreate a clean one)
          docker network ls --filter name=virtualpytest_default --format '{{.ID}}' | xargs -r docker network rm 2>/dev/null || true
      - name: Launch the stack exactly like a user
        run: ./setup/docker/launch.sh

      - name: Smoke — API, UI, host, Supabase, Grafana answer
        run: |
          set -e
          curl -fsS http://localhost:5109/server/health && echo
          curl -fsS -o /dev/null -w 'frontend %{http_code}\n' http://localhost:5073/
          for i in $(seq 1 30); do curl -fsS http://localhost:6109/host/system/health >/dev/null 2>&1 && break; sleep 5; done
          curl -fsS http://localhost:6109/host/system/health && echo
          source setup/docker/.env
          curl -fsS -o /dev/null -w 'supabase rest %{http_code}\n' -H "apikey: ${SERVICE_ROLE_KEY}" http://localhost:54321/rest/v1/
          curl -fsS -o /dev/null -w 'grafana %{http_code}\n' http://localhost:3000/api/health
          docker compose -f setup/docker/docker-compose.yml -f setup/docker/docker-compose.linux.yml ps

      - name: Logs on failure
        if: failure()
        run: docker compose -f setup/docker/docker-compose.yml -f setup/docker/docker-compose.linux.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f setup/docker/docker-compose.yml -f setup/docker/docker-compose.linux.yml down -v || true

  # Every repo path an onboarding doc names must exist (scripts/docs/check_paths.sh).
  # Scope = the folders already brought up to date; it grows with TASK-15 §5.
  docs-paths:
    name: Docs reference existing paths
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'white' }}
    timeout-minutes: 5
    steps:
      # full history + tags: check_bug_meta.py compares each shipped release-note section
      # against the tag that carries it, which a depth-1 clone cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/docs/check_paths.sh
      - run: scripts/docs/check_bug_ids.sh

  lint:
    name: Frontend Lint
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'white' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        if: ${{ inputs.runner != 'github-hosted' }}
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run ESLint
        id: run-lint
        continue-on-error: true
        run: cd frontend && npm run lint 2>&1 | tee /tmp/eslint-output.txt; exit ${PIPESTATUS[0]}

      - name: Generate lint HTML report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p lint-report
          STATUS="${{ steps.run-lint.outcome }}"
          python3 - << 'PYEOF'
          import html, os, pathlib
          status = os.environ.get("LINT_STATUS", "unknown")
          color = "#2e7d32" if status == "success" else "#c62828"
          label = "PASSED" if status == "success" else "FAILED"
          import datetime
          ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          try:
              raw = open("/tmp/eslint-output.txt").read()
          except Exception:
              raw = "No output captured"
          output = html.escape(raw[:20000])
          pathlib.Path("lint-report/index.html").write_text(f"""<!DOCTYPE html><html lang="en"><head>
          <meta charset="utf-8"><title>Lint Report</title>
          <style>body{{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#fafafa;color:#212121}}
          h1{{margin:0 0 4px;font-size:1.5rem}}.meta{{color:#666;font-size:.85rem;margin-bottom:16px}}
          .badge{{display:inline-block;padding:4px 20px;border-radius:20px;font-weight:700;font-size:1.1rem;color:#fff;background:{color};margin-bottom:16px}}
          pre{{background:#263238;color:#eceff1;padding:20px;border-radius:8px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap;word-break:break-all}}</style>
          </head><body><h1>Frontend Lint Report</h1>
          <div class="meta">{ts}</div>
          <div class="badge">{label}</div>
          <pre>{output}</pre></body></html>""")
          print("lint-report/index.html written")
          PYEOF
        env:
          LINT_STATUS: ${{ steps.run-lint.outcome }}

      - name: Save CI meta and lint result (LAN runner)
        if: ${{ always() && inputs.runner != 'github-hosted' }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"
          KEY="$HOME/.ssh/ci_reports_key"
          RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/jobs /opt/ci-reports/$RUN/lint"
          ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/meta.json" << EOF
          {"run":$RUN,"repo":"virtualpytest","runner":"${{ runner.name }}","branch":"${{ github.ref_name }}","sha":"${{ github.sha }}","date":"$(date -u '+%Y-%m-%d %H:%M UTC')"}
          EOF
          if [ -d "lint-report" ]; then
            scp -i "$KEY" -o StrictHostKeyChecking=no -r lint-report/. "$SERVER:/opt/ci-reports/$RUN/lint/"
          fi
          echo '{"status":"${{ steps.run-lint.outcome }}","report":"lint","category":"lint"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/lint.json"
          # CI/CD database (separate from the VirtualPyTest DB; see setup/db/cicd/): run row + lint job
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_runs (project, run, run_number, branch, sha, runner, report_url, trigger, suite)
            VALUES ('virtualpytest', '$RUN', $RUN, '${{ github.ref_name }}', '${{ github.sha }}', '${{ runner.name }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/', '$CI_TRIGGER', '$CI_SUITE')
            ON CONFLICT (project, run) DO UPDATE SET branch = EXCLUDED.branch, sha = EXCLUDED.sha, runner = EXCLUDED.runner, trigger = EXCLUDED.trigger, suite = EXCLUDED.suite;" || echo "::warning::ci_runs insert failed"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'lint', 'lint', 'white', '${{ steps.run-lint.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/lint/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, finished_at = now();" || echo "::warning::ci_jobs insert failed"

      # GitHub-hosted capacity has no route to the LAN (no ssh to .103, no psql to .102),
      # so the rows go through the feature's ingest API over the public URL. NOTE: that URL
      # sits behind Cloudflare, which blocks some non-browser sources (verified 2026-09-03);
      # if it answers 403 the run still completes and only the recording is skipped.
      - name: Publish result via ingest API (GitHub-hosted runner)
        if: ${{ always() && inputs.runner == 'github-hosted' }}
        continue-on-error: true
        run: |
          RUN="${{ github.run_number }}"
          BASE="https://virtualpytest.angelstreet.io/server/cicd"
          cat > ingest.json << EOF
          {"run": {"project": "virtualpytest", "run": "$RUN", "run_number": $RUN,
                   "branch": "${{ github.ref_name }}", "sha": "${{ github.sha }}",
                   "runner": "GitHub Actions (${{ runner.name }})",
                   "report_url": "$BASE/report/$RUN/",
                   "trigger": "$CI_TRIGGER", "suite": "$CI_SUITE"},
           "jobs": [{"project": "virtualpytest", "run": "$RUN", "job": "lint",
                     "category": "lint", "layer": "white",
                     "status": "${{ steps.run-lint.outcome }}"}]}
          EOF
          curl -sf -X POST "$BASE/ingest" \
            -H "Authorization: Bearer $CICD_INGEST_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @ingest.json || echo "::warning::cicd ingest failed (Cloudflare or token) — run not recorded"

  typecheck:
    name: Frontend Typecheck
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'white' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        if: ${{ inputs.runner != 'github-hosted' }}
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # tsconfig type-checks features/*/frontend too, and a feature's pure-logic tests
      # import vitest, which is a --no-save dev tool the component-test job installs at
      # run time. Without it tsc stops at "Cannot find module 'vitest'" before reaching
      # anything real.
      - name: Install vitest types
        run: cd frontend && npm install --no-save vitest@2.1.8

      # The gap this job exists to close: `vite build` uses esbuild, which STRIPS types
      # without checking them, and eslint does not type-check either. So a type error never
      # failed anything — verified on 2026-09-07 when react-router 6->7 (#26) left an
      # invalid `future` prop on <BrowserRouter> and all eight checks stayed green while the
      # unfixed tree still built in 16s. tsc is the only gate that sees this class.
      - name: Run tsc --noEmit
        id: run-typecheck
        continue-on-error: true
        run: cd frontend && ./node_modules/.bin/tsc --noEmit -p tsconfig.json 2>&1 | tee /tmp/tsc-output.txt; exit ${PIPESTATUS[0]}

      - name: Generate typecheck HTML report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p typecheck-report
          python3 - << 'PYEOF'
          import datetime, html, os, pathlib
          status = os.environ.get("TSC_STATUS", "unknown")
          color = "#2e7d32" if status == "success" else "#c62828"
          label = "PASSED" if status == "success" else "FAILED"
          ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          try:
              raw = open("/tmp/tsc-output.txt").read()
          except Exception:
              raw = "No output captured"
          errors = [l for l in raw.splitlines() if "): error TS" in l]
          output = html.escape(raw[:20000]) or "No type errors."
          pathlib.Path("typecheck-report/index.html").write_text(f"""<!DOCTYPE html><html lang="en"><head>
          <meta charset="utf-8"><title>Typecheck Report</title>
          <style>body{{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#fafafa;color:#212121}}
          h1{{margin:0 0 4px;font-size:1.5rem}}.meta{{color:#666;font-size:.85rem;margin-bottom:16px}}
          .badge{{display:inline-block;padding:4px 20px;border-radius:20px;font-weight:700;font-size:1.1rem;color:#fff;background:{color};margin-bottom:16px}}
          pre{{background:#263238;color:#eceff1;padding:20px;border-radius:8px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap;word-break:break-all}}</style>
          </head><body><h1>Frontend Typecheck (tsc --noEmit)</h1>
          <div class="meta">{ts} · {len(errors)} error(s)</div>
          <div class="badge">{label}</div>
          <pre>{output}</pre></body></html>""")
          print(f"typecheck-report/index.html written ({len(errors)} errors)")
          PYEOF
        env:
          TSC_STATUS: ${{ steps.run-typecheck.outcome }}

      - name: Save typecheck result (LAN runner)
        if: ${{ always() && inputs.runner != 'github-hosted' }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"
          KEY="$HOME/.ssh/ci_reports_key"
          RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/jobs /opt/ci-reports/$RUN/typecheck"
          if [ -d "typecheck-report" ]; then
            scp -i "$KEY" -o StrictHostKeyChecking=no -r typecheck-report/. "$SERVER:/opt/ci-reports/$RUN/typecheck/"
          fi
          echo '{"status":"${{ steps.run-typecheck.outcome }}","report":"typecheck","category":"lint"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/typecheck.json"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'typecheck', 'lint', 'white', '${{ steps.run-typecheck.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/typecheck/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, finished_at = now();" || echo "::warning::ci_jobs insert failed"

      # Unlike the lint job, this one actually fails the build. A type gate that reports red
      # but returns green would not have stopped #26 either.
      - name: Fail the job if typecheck failed
        if: ${{ steps.run-typecheck.outcome != 'success' }}
        run: |
          echo "::error::tsc --noEmit reported type errors — see the Typecheck report"
          exit 1

  backend-server-tests:
    name: Backend Server Unit Tests
    runs-on: [self-hosted, Linux, X64]
    if: >-
      ${{ !cancelled()
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (github.event_name != 'workflow_dispatch'
          || inputs.suite == 'all' || inputs.suite == 'grey')
      && inputs.runner != 'github-hosted' }}
    needs: lint
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify Python 3.11 (system)
        run: python3.11 --version

      - name: Install dependencies
        run: pip install pytest pytest-html pytest-timeout requests --break-system-packages

      - name: Wait for server readiness
        continue-on-error: true
        env:
          SERVER_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          echo "Waiting for server at $SERVER_URL/server/health ..."
          max_attempts=12
          attempt=0
          # Use -L to follow redirects, -k to ignore SSL errors
          until curl -skfL "$SERVER_URL/server/health" > /dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Server not reachable after $max_attempts attempts — tests will be skipped by conftest."
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts — server not ready, retrying in 10s..."
            sleep 10
          done
          echo "Server is ready."

      - name: Run backend server pytest suite
        id: run-tests
        continue-on-error: true
        env:
          SERVER_URL: ${{ secrets.E2E_BASE_URL }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          # Unlocks the authenticated MCP protocol test (server MCP_SECRET_KEY) and the
          # cicd ingest auth/validation tests; both skipped without these.
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          # Tier B (-m device) executes for real, so it needs the team that owns a navigable
          # navigation tree — the CI fixture team's interface is a shell with no edges and an
          # execution there dies with "No path found from Entry to home". Tier A keeps using
          # TEAM_ID. The id is not a secret (it is committed in frontend/src/config/constants.ts
          # among others); the secret is only an override hook.
          DEVICE_TEAM_ID: ${{ secrets.DEVICE_TEAM_ID || '7fdeb4bb-3639-4ec3-959f-b54769a219ce' }}
          DEVICE_USERINTERFACE: virtualpytest_web
          CICD_INGEST_TOKEN: ${{ secrets.CICD_INGEST_TOKEN }}
          # Role JWTs for the permission/workspace/org/integration suites (~107 tests skip
          # without them). Minted by scripts/setup_test_accounts.py for the fixed *.test@vpt.local
          # users, signed with the server's SUPABASE_JWT_SECRET, valid one year (2026-09-07 →
          # 2027-09-07). Re-run the script and refresh these secrets before they expire.
          AUTH_TEST_JWT: ${{ secrets.AUTH_TEST_JWT }}
          ADMIN_TEST_JWT: ${{ secrets.ADMIN_TEST_JWT }}
          TESTER_TEST_JWT: ${{ secrets.TESTER_TEST_JWT }}
          VIEWER_TEST_JWT: ${{ secrets.VIEWER_TEST_JWT }}
          RUNNER_TEST_JWT: ${{ secrets.RUNNER_TEST_JWT }}
        run: |
          # Report header = run identity (conftest pytest_html_report_title reads CI_REPORT_TITLE)
          export CI_REPORT_TITLE="virtualpytest #${{ github.run_number }} · ${{ github.ref_name }} · ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          rc=0
          # --timeout-method=signal: a test that overruns fails on its own and pytest keeps going, so
          # the HTML report is still written. The thread method aborts the whole process on the first
          # timeout (no report at all — run #290 backend-server-tests was an empty directory).
          # -m: `manual` has real external side effects (LLM credits, Slack posts).
          # Deselected rather than skipped, so the report carries only tests that actually ran.
          pytest tests/backend_server -v -m "not manual" --timeout=30 --timeout-method=signal --html=pytest-report/index.html --self-contained-html || rc=$?
          # pytest-html 4.x hardcodes its result order (Error, Failed, …, Skipped, Passed) in the
          # inline JS; rewrite it so the report lists Passed, then Failed, then Skipped.
          sed -i "s/const initialOrder = \['Error', 'Failed', 'Rerun', 'XFailed', 'XPassed', 'Skipped', 'Passed'\]/const initialOrder = ['Passed', 'Failed', 'Error', 'XPassed', 'XFailed', 'Rerun', 'Skipped']/" pytest-report/index.html || true
          exit $rc

      - name: Save job result
        if: ${{ always() }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"; KEY="$HOME/.ssh/ci_reports_key"; RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/jobs /opt/ci-reports/$RUN/backend-server-tests"
          # Advertise a report only when one was actually produced; otherwise the Reports page
          # would link to an empty directory (404).
          REPORT=null
          if [ -f "pytest-report/index.html" ]; then
            if scp -i "$KEY" -o StrictHostKeyChecking=no -r pytest-report/. "$SERVER:/opt/ci-reports/$RUN/backend-server-tests/"; then
              REPORT='"backend-server-tests"'
            else
              echo "::error::backend-server-tests report upload to $SERVER failed — the Reports page will show no report for this job"
            fi
          fi
          # category "api": live HTTP tests against the deployed server, same family as api-routes
          # (they were labelled "unit" until 2026-09-08, which they never were).
          echo '{"status":"${{ steps.run-tests.outcome }}","report":'"$REPORT"',"category":"api"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/backend-server-tests.json"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'backend-server-tests', 'api', 'grey', '${{ steps.run-tests.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/backend-server-tests/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, report_url = EXCLUDED.report_url, finished_at = now();" || echo "::warning::ci_jobs insert failed"

  frontend-component-tests:
    name: Frontend Component Tests
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'white' }}
    needs: lint
    environment: production
    # 30, matching the E2E jobs, not 15. This is the LONGEST job in the workflow (~6 min
    # alone) and had the tightest budget. With three runners per VM, a Dependabot batch puts
    # two of these on the same 6-core/6 GB VM at once; vitest defaults to one worker per core,
    # so they oversubscribe 2:1 and both blew the 15 min limit (2026-09-07, PRs #25 and #28 —
    # cancelled by timeout, not by a failing test; #25 was a *Python* bump). Raising the ceiling
    # rather than capping vitest workers, which would slow the far commoner solo run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        if: ${{ inputs.runner != 'github-hosted' }}
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install frontend test tooling
        run: |
          cd frontend
          npm install --no-save \
            vitest@2.1.8 \
            @testing-library/react@16.2.0 \
            @testing-library/jest-dom@6.7.0 \
            jsdom@25.0.1 \
            @vitejs/plugin-react@4.7.0
          # Symlink tests/node_modules → frontend/node_modules so that Vite's module
          # resolver can find packages when walking up from tests/frontend/.
          # Remove any existing directory first: on a persistent self-hosted workspace
          # `ln -sfn` into an existing dir creates the link INSIDE it and vitest then
          # fails with "Cannot find module '@vitejs/plugin-react'".
          rm -rf ../tests/node_modules
          ln -s "$(pwd)/node_modules" ../tests/node_modules

      - name: Run frontend component tests
        id: run-tests
        continue-on-error: true
        run: cd frontend && npx vitest run --config ../tests/frontend/vitest.config.ts --reporter=json --outputFile=../vitest-results.json 2>&1 | tee /tmp/vitest-output.txt; exit ${PIPESTATUS[0]}

      # Standalone generator (tests/frontend/vitest_html_report.py): every row expands to the
      # test's file, its it(...) source and vitest's failure text; the runner output is
      # appended for console.log/warnings. Run it locally against any vitest JSON.
      - name: Generate vitest HTML report
        if: always()
        continue-on-error: true
        run: |
          python3 tests/frontend/vitest_html_report.py \
            --results vitest-results.json --output vitest-report/index.html \
            --status "${{ steps.run-tests.outcome }}" --raw-output /tmp/vitest-output.txt --repo-root .

      - name: Save job result (LAN runner)
        if: ${{ always() && inputs.runner != 'github-hosted' }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"; KEY="$HOME/.ssh/ci_reports_key"; RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/jobs /opt/ci-reports/$RUN/frontend-component-tests"
          if [ -f "vitest-report/index.html" ]; then
            scp -i "$KEY" -o StrictHostKeyChecking=no -r vitest-report/. "$SERVER:/opt/ci-reports/$RUN/frontend-component-tests/"
          fi
          echo '{"status":"${{ steps.run-tests.outcome }}","report":"frontend-component-tests","category":"unit"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/frontend-component-tests.json"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'frontend-component-tests', 'unit', 'white', '${{ steps.run-tests.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/frontend-component-tests/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, report_url = EXCLUDED.report_url, finished_at = now();" || echo "::warning::ci_jobs insert failed"

      # Same reasoning as the lint job: no LAN route from GitHub-hosted capacity.
      - name: Publish result via ingest API (GitHub-hosted runner)
        if: ${{ always() && inputs.runner == 'github-hosted' }}
        continue-on-error: true
        run: |
          RUN="${{ github.run_number }}"
          BASE="https://virtualpytest.angelstreet.io/server/cicd"
          cat > ingest.json << EOF
          {"jobs": [{"project": "virtualpytest", "run": "$RUN", "job": "frontend-component-tests",
                     "category": "unit", "layer": "white",
                     "status": "${{ steps.run-tests.outcome }}"}]}
          EOF
          curl -sf -X POST "$BASE/ingest" \
            -H "Authorization: Bearer $CICD_INGEST_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @ingest.json || echo "::warning::cicd ingest failed (Cloudflare or token) — job not recorded"

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: [self-hosted, Linux, X64]
    if: >-
      ${{ !cancelled()
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (github.event_name != 'workflow_dispatch'
          || inputs.suite == 'all' || inputs.suite == 'grey')
      && inputs.runner != 'github-hosted' }}
    needs: lint
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure CI Reports SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_SSH_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/playwright/package-lock.json

      - name: Install E2E dependencies
        run: cd tests/e2e/playwright && npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/e2e/playwright/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd tests/e2e/playwright && ./node_modules/.bin/playwright install chromium --with-deps

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          max_retries=3
          for i in $(seq 1 $max_retries); do
            cd tests/e2e/playwright && ./node_modules/.bin/playwright install-deps chromium && break
            echo "Retry $i/$max_retries in 30s (transient apt timing issue)..."
            sleep 30
          done

      - name: Run E2E smoke
        id: run-e2e-smoke
        continue-on-error: true
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_AUTO_SIGN_TOKEN: ${{ secrets.E2E_AUTO_SIGN_TOKEN }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: tests/e2e/playwright/run_e2e_smoke.sh

      - name: Inject toolbar into Playwright report
        if: always()
        continue-on-error: true
        run: |
          python3 - << 'PYEOF'
          import pathlib
          idx = pathlib.Path("tests/e2e/playwright/playwright-report/index.html")
          if not idx.exists(): exit(0)
          toolbar = '''<div id="vpt-toolbar" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#1e1e2e;border-bottom:1px solid #444;display:flex;align-items:center;gap:8px;padding:6px 14px;font-family:system-ui,sans-serif;font-size:13px">
            <button onclick="history.back()" style="background:#333;color:#ccc;border:1px solid #555;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px">&#8592; Back</button>
            <span style="color:#666;font-size:11px;margin-left:auto">E2E Smoke Report</span>
          </div><div style="height:38px"></div>'''
          content = idx.read_text(encoding='utf-8')
          if 'vpt-toolbar' not in content:
              idx.write_text(content.replace('<body>', '<body>' + toolbar, 1), encoding='utf-8')
          PYEOF

      - name: Setup SSH key for report upload
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_KEY }}" > ~/.ssh/ci_reports_key
          chmod 600 ~/.ssh/ci_reports_key
          # A stale ci_reports_key.pub next to the key makes ssh offer THAT public key while signing
          # with the new private key -> 'Permission denied' (runner clone 164, 2026-09-07).
          rm -f ~/.ssh/ci_reports_key.pub
          ssh-keyscan -H 192.168.0.103 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Save report and job result
        if: ${{ always() }}
        continue-on-error: true
        run: |
          SERVER="${{ secrets.CI_REPORTS_SERVER }}"; KEY="$HOME/.ssh/ci_reports_key"; RUN="${{ github.run_number }}"
          ssh -i "$KEY" "$SERVER" "mkdir -p /opt/ci-reports/$RUN/e2e-smoke /opt/ci-reports/$RUN/jobs"
          if [ -d "tests/e2e/playwright/playwright-report" ]; then
            scp -i "$KEY" -o StrictHostKeyChecking=no -r tests/e2e/playwright/playwright-report/. "$SERVER:/opt/ci-reports/$RUN/e2e-smoke/"
          fi
          echo '{"status":"${{ steps.run-e2e-smoke.outcome }}","report":"e2e-smoke","category":"browser"}' \
            | ssh -i "$KEY" "$SERVER" "cat > /opt/ci-reports/$RUN/jobs/e2e-smoke.json"
          psql "$CICD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "INSERT INTO ci_jobs (project, run, job, category, layer, status, report_url)
            VALUES ('virtualpytest', '$RUN', 'e2e-smoke', 'browser', 'grey', '${{ steps.run-e2e-smoke.outcome }}', 'https://virtualpytest.angelstreet.io/server/cicd/report/$RUN/e2e-smoke/')
            ON CONFLICT (project, run, job) DO UPDATE SET status = EXCLUDED.status, report_url = EXCLUDED.report_url, finished_at = now();" || echo "::warning::ci_jobs insert failed"
          # Keep only the 100 most recent virtualpytest runs on the server. Prune by modification
          # time, NOT by run number: numbering restarted at #1 with the repo move, so a numeric
          # sort would delete the newest runs first (it wiped run 142 on 2026-09-03).
          ssh -i "$KEY" "$SERVER" "cd /opt/ci-reports && ls -dt \$(ls | grep -E '^[0-9]+$') 2>/dev/null | tail -n +101 | xargs -r rm -rf"

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report-${{ github.run_number }}
          path: tests/e2e/playwright/playwright-report/
          retention-days: 7

  e2e-pages:
