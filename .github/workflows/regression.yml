      - name: Setup SSH key for report upload
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_REPORTS_KEY }}" > ~/.ssh/ci_reports_key
