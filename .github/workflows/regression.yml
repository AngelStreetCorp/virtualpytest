            <span style="color:#666;font-size:11px;margin-left:auto">E2E Pages Report</span>
          </div><div style="height:38px"></div>'''
          content = idx.read_text(encoding='utf-8')
          if 'vpt-toolbar' not in content:
              idx.write_text(content.replace('<body>', '<body>' + toolbar, 1), encoding='utf-8')
              print("Toolbar injected into e2e-pages index.html")
